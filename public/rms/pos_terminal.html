<style>

:root{
  --bg:#f0f4f8;--bg2:#fff;--border:#e2e8f0;
  --text:#1a202c;--text2:#4a5568;--text3:#a0aec0;
  --accent:#3182ce;--accent-bg:#ebf8ff;
  --green:#276749;--green-bg:#f0fff4;--green-bd:#9ae6b4;
  --orange:#c05621;--orange-bg:#fffaf0;--orange-bd:#fbd38d;
  --red:#c53030;--red-bg:#fff5f5;--red-bd:#fed7d7;
  --yellow:#b7791f;--yellow-bg:#fffff0;--yellow-bd:#fefcbf;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text)}

body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.login{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.login.hidden{display:none}
.lcard{background:#fff;border-radius:16px;padding:32px 28px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lcard img{height:56px;object-fit:contain;margin-bottom:12px}
.lcard h2{font-size:17px;font-weight:700;margin-bottom:16px}
.lcard select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:14px;font-family:var(--font);background:#fff;outline:none}
.pins{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pin{width:48px;height:52px;border:2px solid var(--border);border-radius:10px;font-size:22px;text-align:center;font-family:var(--font);background:#fff;outline:none}
.pin:focus{border-color:var(--accent)}
.lbtn{width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)}
.lerr{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar img{height:32px;object-fit:contain}
.topbar-title{font-size:15px;font-weight:700;flex:1}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:var(--font)}
.lb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar-user{font-size:13px;color:var(--text2)}
.logout-btn{padding:5px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:13px;font-family:var(--font)}

.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a202c;color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.notif.show{opacity:1}

/* POS layout */
.pos{flex:1;display:flex;overflow:hidden;min-height:0}
/* Menu side */
.menu-side{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mode-bar{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.mbtn{flex:1;padding:9px;border:none;background:var(--bg);color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);border-bottom:3px solid transparent}
.mbtn.on{background:#fff;color:var(--accent);border-bottom-color:var(--accent)}
.table-bar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:52px}
.room-bill-bar{padding:6px 10px;background:var(--accent-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.rb-toggle{padding:6px 12px;border-radius:8px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)}
.rb-toggle.on{background:var(--accent);color:#fff}
.rb-rooms{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rb-room-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)}
.rb-room-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.rb-cancel{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.rb-release{margin-top:6px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--orange-bd);background:var(--orange-bg);color:var(--orange);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);display:block}
.table-label{font-size:12px;font-weight:600;white-space:nowrap;color:var(--text2)}
.tgrid{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
.tgrid::-webkit-scrollbar{display:none}
.ttile{min-width:40px;height:38px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font);padding:0 3px}
.ttile.occ{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.ttile.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.ttile-n{font-size:13px;font-weight:800;line-height:1}
.ttile-s{font-size:9px;line-height:1;margin-top:1px}
.cat-bar{padding:6px 10px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:5px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cbtn{flex-shrink:0;padding:5px 11px;border-radius:14px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:var(--font)}
.cbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mgrid{flex:1;overflow-y:auto;padding:8px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;align-content:start}
.mcard{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px;cursor:pointer;position:relative;transition:border-color .1s,box-shadow .1s}
.mcard:active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.mcard-cat{font-size:9px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.mcard-name{font-size:12px;font-weight:600;line-height:1.3}
.mcard-price{font-size:12px;color:var(--accent);font-weight:700;margin-top:3px}
.mcard-badge{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#fff;width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* Order panel */
.order-panel{width:290px;flex-shrink:0;background:#fff;border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
/* Mobile */
@media(max-width:660px){
  .order-panel{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:72vh;border-left:none;border-top:2px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:40;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
  .order-panel.open{transform:translateY(0)}
  .drag-handle{display:flex!important}
  .fab{display:flex!important}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .mcard-name{font-size:11px}
}
.drag-handle{display:none;justify-content:center;padding:7px;cursor:pointer;flex-shrink:0}
.drag-handle-bar{width:34px;height:4px;border-radius:2px;background:var(--border)}
.fab{position:fixed;bottom:14px;right:14px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 3px 14px rgba(49,130,206,.45);align-items:center;justify-content:center;z-index:39;display:none}
.fab-n{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;width:19px;height:19px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.panel-head{padding:10px 13px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.existing-orders{background:var(--accent-bg);border-bottom:1px solid var(--border);padding:8px 12px;font-size:12px;flex-shrink:0;display:none;max-height:96px;overflow-y:auto}
.existing-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}
.existing-item{color:var(--text2);padding:1px 0}
.olist{flex:1;min-height:0;overflow-y:auto;padding:6px 8px}
.oempty{display:flex;align-items:center;justify-content:center;height:70px;color:var(--text3);font-size:13px}
.oitem{display:flex;align-items:center;gap:7px;padding:6px 3px;border-bottom:1px solid var(--border)}
.oitem:last-child{border-bottom:none}
.oitem-info{flex:1;min-width:0}
.oitem-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oitem-price{font-size:11px;color:var(--text3)}
.qctrl{display:flex;align-items:center;gap:3px;flex-shrink:0}
.qbtn{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.qbtn-del{margin-left:4px;color:var(--red);border-color:var(--red-bd);background:var(--red-bg);font-size:11px}
.qn{font-size:12px;font-weight:700;min-width:18px;text-align:center}
.note-area{padding:6px 8px;flex-shrink:0;border-top:1px solid var(--border)}
.note-area textarea{width:100%;padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:var(--font);resize:none;outline:none;height:38px}
.manual-btn{margin:6px 8px 0;padding:8px;border-radius:8px;border:1.5px dashed var(--border);background:var(--bg);color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);flex-shrink:0}
.manual-overlay{display:none;position:fixed;inset:0;background:rgba(26,32,44,.75);z-index:120;align-items:center;justify-content:center}
.manual-overlay.show{display:flex}
.manual-card{background:#fff;border-radius:16px;padding:22px;width:90%;max-width:340px;text-align:left}
.manual-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.manual-input{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:14px;margin-bottom:14px;outline:none}
.mcatbtn{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)}
.mcatbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.total-row{padding:9px 13px;border-top:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:15px;font-weight:800}
.actions{padding:7px 9px 10px;display:flex;gap:7px;flex-shrink:0}
.abtn{flex:1;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}
.abtn.clr{background:var(--bg);color:var(--text2);border:1.5px solid var(--border)}
.abtn.snd{background:var(--accent);color:#fff}
.abtn.off{opacity:.4}
.abtn:disabled{opacity:.35;cursor:not-allowed}
/* Sent overlay */
.sent-ov{position:fixed;inset:0;background:rgba(49,130,206,.92);display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;opacity:0;transition:opacity .25s}
.sent-ov.show{opacity:1}
.sent-box{text-align:center;color:#fff}
.sent-icon{font-size:56px}
.sent-msg{font-size:22px;font-weight:800;margin-top:6px}
.sent-sub{font-size:13px;opacity:.85;margin-top:3px}
/* Backdrop */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.backdrop.show{display:block}

function buildSelect(){
  var sel=document.getElementById('login-role');
  if(!sel)return;
  sel.innerHTML='<option value="">— '+t('selectStaff')+' —</option>';
  staff.filter(function(s){return s.active;}).forEach(function(s){
    var o=document.createElement('option');o.value=s.id;
    o.textContent=s.fname+' '+(s.lname||'');sel.appendChild(o);
  });
}

function initPins(){
  var pins=document.querySelectorAll('.pin');
  pins.forEach(function(el,i){
    el.setAttribute('readonly','');
    el.addEventListener('focus',function(){this.removeAttribute('readonly');this.value='';});
    el.addEventListener('input',function(){
      if(this.value&&i<pins.length-1) pins[i+1].focus();
      else if(i===pins.length-1&&Array.from(pins).every(function(p){return p.value;})) doLogin();
    });
    el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!this.value&&i>0)pins[i-1].focus();});
  });
}

function clearPins(){document.querySelectorAll('.pin').forEach(function(el){el.value='';el.setAttribute('readonly','');});}

function autoLoginFromQuery(){
  try{
    var params=new URLSearchParams(location.search);
    var sid=params.get('autostaff');
    var pin=params.get('autopin');
    if(!sid||!pin)return;
    var sel=document.getElementById('login-role');
    if(sel) sel.value=sid;
    var pins=document.querySelectorAll('.pin');
    for(var i=0;i<pins.length;i++){pins[i].removeAttribute('readonly');pins[i].value=pin[i]||'';}
    doLogin();
  }catch(e){console.warn('Auto-Login fehlgeschlagen:',e);}
}
function doLogin(){
  var sid=document.getElementById('login-role').value;
  var pin=Array.from(document.querySelectorAll('.pin')).map(function(p){return p.value;}).join('');
  var m=staff.find(function(s){return String(s.id)===String(sid);});
  if(!m){document.getElementById('login-err').textContent=t('selectStaff');return;}
  if(m.pin===null||m.pin===undefined||m.pin===''){document.getElementById('login-err').textContent=t('noPin');clearPins();return;}
  if(pin.length<4||String(m.pin).padStart(4,'0')!==pin){document.getElementById('login-err').textContent=t('wrongPin');clearPins();document.querySelectorAll('.pin')[0].focus();return;}
  document.getElementById('login').classList.add('hidden');
  var un=document.getElementById('topbar-user');if(un)un.textContent=m.fname;
  if(typeof afterLogin==='function')afterLogin(m);
}

function doLogout(){
  logAction('Abgemeldet','POS');
  document.getElementById('login').classList.remove('hidden');
  clearPins();
  document.getElementById('login-err').textContent='';
  if(typeof afterLogout==='function')afterLogout();
}


function notify(msg,dur){var el=document.getElementById('notif');if(!el)return;el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},dur||2500);}

  document.getElementById('manual-add-btn').textContent=t('manualAddBtn');
  document.getElementById('manual-cat-wrap').style.display=mode==='minibar'?'none':'block';
  document.getElementById('release-table-btn').textContent=t('releaseTable');
  updateRbToggle();
  document.querySelector('.note-area textarea').placeholder=t('note');
  buildCats();buildMenu();
  if(mode==='minibar'){renderRooms();}else{renderTables();}
  renderOrder();
}

function setMode(m){
  if(mode===m)return;
  mode=m;
  order=[];curCat='';selTable=null;billRoom=null;roomBillPending=false;
  document.getElementById('mode-restaurant').classList.toggle('on',m==='restaurant');
  document.getElementById('mode-minibar').classList.toggle('on',m==='minibar');
  document.getElementById('room-bill-bar').style.display='none';
  document.getElementById('rb-rooms').style.display='none';
  renderAll();
  if(m==='minibar'){loadRooms();}else{loadTables();}
}

function renderTables(){
  var g=document.getElementById('tgrid');
  g.innerHTML=tables.map(function(tb){
    var cls='ttile'+(tb.status==='occupied'?' occ':'')+(selTable===tb.num?' sel':'');
    return '<div class="'+cls+'" data-n="'+tb.num+'"><div class="ttile-n">'+tb.num+'</div><div class="ttile-s">'+t(tb.status==='occupied'?'busy':'free')+'</div></div>';
  }).join('');
  g.onclick=function(e){var el=e.target.closest('.ttile');if(el)selectTable(+el.dataset.n);};
}

function renderRooms(){
  var g=document.getElementById('tgrid');
  g.innerHTML=rooms.map(function(rm){
    var cls='ttile'+(rm.status==='occupied'?' occ':'')+(selRoom&&selRoom.id===rm.id?' sel':'');
    return '<div class="'+cls+'" data-id="'+rm.id+'" style="min-width:64px"><div class="ttile-n" style="font-size:11px">'+rm.name+'</div><div class="ttile-s">'+t(rm.status==='occupied'?'busy':'free')+'</div></div>';
  }).join('');
  g.onclick=function(e){var el=e.target.closest('.ttile');if(el)selectRoom(+el.dataset.id);};
}

function selectTable(n){
  selTable=n;
  renderTables();
  updateBtn();
  document.getElementById('tbl-label').textContent=tw()+n;
  loadExistingOrders(n);
  billRoom=null;roomBillPending=false;
  document.getElementById('room-bill-bar').style.display='block';
  document.getElementById('rb-rooms').style.display='none';
  updateRbToggle();
  updateReleaseBtn();
}

function selectRoom(id){
  selRoom=rooms.find(function(r){return r.id===id;});
  renderRooms();
  updateBtn();
  document.getElementById('tbl-label').textContent=selRoom?selRoom.name:t('selectRoom');
  loadExistingOrders(null,id);
}

async function assignExistingOrdersToRoom(){
  if(!billRoom||!selTable)return;
  try{
    await sbPatch('orders','table_number=eq.'+selTable+'&order_type=eq.restaurant&status=in.(new,cooking,making,ready)',{room_id:billRoom.id});
    logAction('Zimmerrechnung zugeordnet','Tisch '+selTable+' → '+billRoom.name);
    notify('✓ '+t('billToRoomOn')+billRoom.name);
    loadExistingOrders(selTable);
  }catch(e){notify('⚠ '+e.message);}
  updateReleaseBtn();
}

function updateReleaseBtn(){
  var el=document.getElementById('release-table-btn');
  if(!el)return;
  el.style.display=billRoom?'block':'none';
}

async function releaseTable(){
  if(!billRoom||!selTable)return;
  var confirmMsg=t('releaseConfirm').replace('{t}',selTable).replace('{r}',billRoom.name);
  if(!confirm(confirmMsg))return;
  try{
    await sbPatch('orders','table_number=eq.'+selTable+'&order_type=eq.restaurant&room_id=eq.'+billRoom.id+'&status=in.(new,cooking,making,ready)',{table_number:null});
    logAction('Tisch freigegeben (Zimmerrechnung läuft weiter)','Tisch '+selTable+' → '+billRoom.name);
    notify('✓ '+t('tableReleased'));
    selTable=null;billRoom=null;
    document.getElementById('room-bill-bar').style.display='none';
    document.getElementById('tbl-label').textContent=t('selectTable');
    document.getElementById('existing-orders').style.display='none';
    loadTables();
    renderTables();
  }catch(e){notify('⚠ '+e.message);}
}

function updateRbToggle(){
  var btn=document.getElementById('rb-toggle');
  if(billRoom){
    btn.textContent=t('billToRoomOn')+billRoom.name;
    btn.classList.add('on');
  }else{
    btn.textContent=t('billToRoom');
    btn.classList.remove('on');
  }
}

async function toggleRoomBill(){
  var wrap=document.getElementById('rb-rooms');
  if(billRoom){
    billRoom=null;
    updateRbToggle();
    wrap.style.display='none';
    updateBtn();
    return;
  }
  if(!rooms.length){
    try{rooms=await sbGet('rooms','active=eq.true&order=sort_order&select=id,name');rooms.forEach(function(r){r.status='free';});}catch(e){rooms=[];}
  }
  wrap.innerHTML=rooms.map(function(r){
    return '<button class="rb-room-btn" data-id="'+r.id+'">'+r.name+'</button>';
  }).join('')+'<button class="rb-room-btn rb-cancel" data-cancel="1">✕ '+t('cancel')+'</button>';
  wrap.style.display='flex';
  roomBillPending=true;
  updateBtn();
}
document.addEventListener('click',function(e){
  var cancelBtn=e.target.closest('.rb-cancel');
  if(cancelBtn){
    roomBillPending=false;billRoom=null;
    document.getElementById('rb-rooms').style.display='none';
    updateRbToggle();updateBtn();
    return;
  }
  var b=e.target.closest('.rb-room-btn');
  if(b){
    billRoom=rooms.find(function(r){return r.id===+b.dataset.id;});
    roomBillPending=false;
    updateRbToggle();
    document.getElementById('rb-rooms').style.display='none';
    assignExistingOrdersToRoom();
  }
});

async function loadExistingOrders(n,roomId){
  try{
    var q=roomId
      ?'select=id,status,total_k,created_at,order_items(name,quantity,category)&room_id=eq.'+roomId+'&order_type=eq.minibar&status=in.(new,cooking,making,ready)&order=created_at.desc&limit=10'
      :'select=id,status,total_k,created_at,room_id,order_items(name,quantity,category),rooms(name)&table_number=eq.'+n+'&status=in.(new,cooking,making,ready)&order=created_at.desc&limit=5';
    var d=await sbGet('orders',q);
    existingOrders=d;
    var box=document.getElementById('existing-orders');
    if(!d.length){box.style.display='none';}
    else{
      box.style.display='block';
      var sum=d.reduce(function(s,o){return s+(o.total_k||0);},0);
      document.getElementById('existing-title').textContent=t('openOrder')+' ('+d.length+') · Rp '+sum+'k';
      document.getElementById('existing-items').innerHTML=d.map(function(o){
        var items=(o.order_items||[]).map(function(i){return i.quantity+'× '+i.name;}).join(', ');
        var mins=Math.round((Date.now()-new Date(o.created_at).getTime())/60000);
        return '<div class="existing-item">#'+o.id+' · '+items+' · '+mins+' min · Rp '+(o.total_k||0)+'k</div>';
      }).join('');
    }
    // Falls dieser Tisch bereits einer Zimmerrechnung zugeordnet ist: Freigeben-Option sofort anzeigen
    if(!roomId&&mode==='restaurant'){
      var roomBilled=d.find(function(o){return o.room_id;});
      if(roomBilled){
        billRoom={id:roomBilled.room_id,name:roomBilled.rooms?roomBilled.rooms.name:'?'};
        updateRbToggle();
        document.getElementById('rb-rooms').style.display='none';
        updateReleaseBtn();
      }
    }
  }catch(e){document.getElementById('existing-orders').style.display='none';}
}

function buildCats(){
  var bar=document.getElementById('catbar');
  if(mode==='minibar'){bar.innerHTML='';bar.onclick=null;return;}
  var cats=[''];
  menu.forEach(function(m){if(m.cat!=='Minibar'&&cats.indexOf(m.cat)<0)cats.push(m.cat);});
  bar.innerHTML=cats.map(function(c){
    return '<button class="cbtn'+(curCat===c?' on':'')+'" data-c="'+c+'">'+(c||t('allCats'))+'</button>';
  }).join('');
  bar.onclick=function(e){var b=e.target.closest('.cbtn');if(b){curCat=b.dataset.c;buildCats();buildMenu();}};
}

function buildMenu(){
  var base=mode==='minibar'?menu.filter(function(m){return m.cat==='Minibar';}):menu.filter(function(m){return m.cat!=='Minibar';});
  var filtered=curCat?base.filter(function(m){return m.cat===curCat;}):base;
  var g=document.getElementById('mgrid');
  g.innerHTML=filtered.map(function(m){
    var inO=order.find(function(o){return o.id===m.id;});
    return '<div class="mcard" data-id="'+m.id+'">'+
      '<div class="mcard-cat">'+m.cat+'</div>'+
      '<div class="mcard-name">'+m.name+'</div>'+
      '<div class="mcard-price">Rp '+m.price+'k</div>'+
      (inO?'<div class="mcard-badge">'+inO.qty+'</div>':'')+
      '</div>';
  }).join('');
  g.onclick=function(e){var el=e.target.closest('.mcard');if(el)addItem(+el.dataset.id);};
}

function addItem(id){
  var m=menu.find(function(x){return x.id===id;});
  if(!m)return;
  var ex=order.find(function(o){return o.id===id;});
  if(ex){ex.qty++;}else{order.push({id:m.id,name:m.name,price:m.price,cat:m.cat,qty:1});}
  renderOrder();buildMenu();updateFab();
}

var manualCat='Tapas';
function openManualAdd(){
  document.getElementById('manual-name').value='';
  document.getElementById('manual-price').value='';
  document.getElementById('manual-qty').value='1';
  manualCat='Tapas';
  document.getElementById('manual-cat-kitchen').classList.add('on');
  document.getElementById('manual-cat-bar').classList.remove('on');
  document.getElementById('manual-overlay').classList.add('show');
}
function closeManualAdd(){document.getElementById('manual-overlay').classList.remove('show');}
document.addEventListener('click',function(e){
  var b=e.target.closest('.mcatbtn');
  if(b){
    manualCat=b.dataset.c;
    document.querySelectorAll('.mcatbtn').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
  }
});
function addManualItem(){
  var name=document.getElementById('manual-name').value.trim();
  var price=parseFloat((document.getElementById('manual-price').value||'').replace(',','.'))||0;
  var qty=parseInt(document.getElementById('manual-qty').value)||1;
  if(qty<1)qty=1;
  if(!name||price<=0){notify('⚠ '+t('manualFillAll'));return;}
  if(price>=1000){
    var suggested=Math.round(price/1000);
    var msg=t('priceWarn').replace('{p}',price).replace('{s}',suggested);
    if(!confirm(msg))return;
  }
  var cat=mode==='minibar'?'Minibar':manualCat;
  var id='manual_'+Date.now();
  order.push({id:id,name:name,price:price,cat:cat,qty:qty});
  closeManualAdd();
  renderOrder();buildMenu();updateFab();
}

function changeQty(id,d){
  var i=order.findIndex(function(o){return String(o.id)===String(id);});
  if(i<0)return;
  order[i].qty+=d;
  if(order[i].qty<=0)order.splice(i,1);
  renderOrder();buildMenu();updateFab();
}

function removeOrderItem(id){
  var i=order.findIndex(function(o){return String(o.id)===String(id);});
  if(i<0)return;
  order.splice(i,1);
  renderOrder();buildMenu();updateFab();
}

function clearOrder(){order=[];renderOrder();buildMenu();updateFab();closeCart();}

function renderOrder(){
  var list=document.getElementById('olist');
  document.getElementById('panel-count').textContent=order.length?'('+order.length+')':'';
  if(!order.length){
    list.innerHTML='<div class="oempty">'+t('empty')+'</div>';
    document.getElementById('ototal').textContent='Rp 0k';
    updateBtn();return;
  }
  var total=order.reduce(function(s,o){return s+o.price*o.qty;},0);
  list.innerHTML=order.map(function(o){
    return '<div class="oitem" data-id="'+o.id+'">'+
      '<div class="oitem-info"><div class="oitem-name">'+o.name+'</div><div class="oitem-price">Rp '+o.price+'k</div></div>'+
      '<div class="qctrl">'+
        '<div class="qbtn" data-act="dec">−</div>'+
        '<span class="qn">'+o.qty+'</span>'+
        '<div class="qbtn" data-act="inc">+</div>'+
        '<div class="qbtn qbtn-del" data-act="del" title="Entfernen">✕</div>'+
      '</div></div>';
  }).join('');
  document.getElementById('ototal').textContent='Rp '+total+'k';
  updateBtn();
}
document.getElementById('olist').addEventListener('click',function(e){
  var btn=e.target.closest('.qbtn');
  if(!btn)return;
  var row=e.target.closest('.oitem');
  if(!row)return;
  var id=row.dataset.id;
  if(btn.dataset.act==='dec')changeQty(id,-1);
  else if(btn.dataset.act==='inc')changeQty(id,1);
  else if(btn.dataset.act==='del')removeOrderItem(id);
});

function updateBtn(){document.getElementById('snd-btn').classList.toggle('off',!(order.length&&(mode==='minibar'?selRoom:selTable))||roomBillPending);}
function updateFab(){
  var n=order.reduce(function(s,o){return s+o.qty;},0);
  var fab=document.getElementById('fab');
  fab.style.display=n>0?'flex':'none';
  document.getElementById('fab-n').textContent=n;
}
function toggleCart(){
  var p=document.getElementById('order-panel');
  var b=document.getElementById('backdrop');
  var open=p.classList.toggle('open');
  b.classList.toggle('show',open);
}
function closeCart(){
  document.getElementById('order-panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

async function sendOrder(){
  if(mode==='minibar'){
    if(!selRoom){notify('⚠ '+t('noRoomSel'));return;}
  }else{
    if(!selTable){notify('⚠ '+t('noTableSel'));return;}
  }
  if(roomBillPending){notify('⚠ '+t('roomBillPendingWarn'));return;}
  if(!order.length){notify('⚠ '+t('cartEmpty'));return;}
  var note=document.getElementById('onote').value;
  var total=order.reduce(function(s,o){return s+o.price*o.qty;},0);
  try{
    var payload=mode==='minibar'
      ?{room_id:selRoom.id,order_type:'minibar',note:note,status:'new',total_k:total}
      :{table_number:selTable,order_type:'restaurant',room_id:billRoom?billRoom.id:null,note:note,status:'new',total_k:total};
    var res=await sbPost('orders',payload);
    var oid=res[0].id;
    await sbPost('order_items',order.map(function(o){
      return {order_id:oid,menu_item_id:(typeof o.id==='number'?o.id:null),name:o.name,price_k:o.price,quantity:o.qty,category:o.cat};
    }));
    var subLabel;
    if(mode==='minibar'){
      selRoom.status='occupied';
      logAction('Minibar erfasst',selRoom.name+' · '+order.length+' Position(en) · Rp '+total+'k');
      subLabel=selRoom.name+' · Rp '+total+'k';
    }else{
      var tb=tables.find(function(x){return x.num===selTable;});if(tb)tb.status='occupied';
      logAction('Bestellung aufgegeben','Tisch '+selTable+(billRoom?' · Zimmerrechnung '+billRoom.name:'')+' · '+order.length+' Position(en) · Rp '+total+'k');
      subLabel=tw()+selTable+(billRoom?' · 🏨 '+billRoom.name:'')+' · Rp '+total+'k';
    }
    var ov=document.getElementById('sent-ov');
    document.getElementById('sent-msg').textContent=t('sent');
    document.getElementById('sent-sub').textContent=subLabel;
    ov.classList.add('show');
    setTimeout(function(){
      ov.classList.remove('show');
      order=[];document.getElementById('onote').value='';
      billRoom=null;updateRbToggle();
      renderOrder();buildMenu();updateFab();closeCart();
      if(mode==='minibar'){renderRooms();loadExistingOrders(null,selRoom.id);}
      else{renderTables();loadExistingOrders(selTable);}
    },2000);
  }catch(e){notify('⚠ '+e.message);}
}

async function loadTables(){
  try{
    var d=await sbGet('orders','select=table_number&status=in.(new,cooking,making,ready)&order_type=eq.restaurant');
    var busy=d.map(function(o){return o.table_number;});
    tables.forEach(function(tb){tb.status=busy.indexOf(tb.num)>=0?'occupied':'free';});
    if(mode==='restaurant')renderTables();
  }catch(e){}
}

async function loadRooms(){
  try{
    if(!rooms.length){
      rooms=await sbGet('rooms','active=eq.true&order=sort_order&select=id,name');
      rooms.forEach(function(r){r.status='free';});
    }
    var d=await sbGet('orders','select=room_id&status=in.(new,cooking,making,ready)&order_type=eq.minibar');
    var busy=d.map(function(o){return o.room_id;});
    rooms.forEach(function(r){r.status=busy.indexOf(r.id)>=0?'occupied':'free';});
    if(mode==='minibar')renderRooms();
  }catch(e){}
}

function afterLogin(m){
  currentStaff=m;
  setLang(m.preferred_lang||'de');
  logAction('Angemeldet','POS');
  renderAll();loadTables();
  setInterval(function(){if(mode==='minibar')loadRooms();else loadTables();},30000);
}
function afterLogout(){order=[];selTable=null;selRoom=null;mode='restaurant';clearOrder();}

window.addEventListener('DOMContentLoaded',function(){
  loadStaff();initPins();
  renderAll();
  document.getElementById('mode-bar').onclick=function(e){var b=e.target.closest('.mbtn');if(b)setMode(b.dataset.m);};
  // Rücktaste/Geste soll die App nicht beenden — Abmeldung nur über den ⏻-Button
  for(var _i=0;_i<8;_i++){history.pushState(null,'',location.href);}
  window.addEventListener('popstate',function(){history.pushState(null,'',location.href);});
});
</script>
</body>
</html>
